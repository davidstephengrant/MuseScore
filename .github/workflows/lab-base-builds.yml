name: 'Lab: base builds'

# Keeps development builds of upstream's base branches ready for the test lab.
# Fork only: pushes lab-* branches here and starts the build workflows on them.
# Hourly, at an odd minute (GitHub drops many runs at busy times like :00, :15
# and :30): for each open upstream PR assigned to or written by the fork's
# owner, the base commit its CI build was made from is built as
# lab-<base>-<sha7>, if it isn't yet; and lab-<base> follows each base in BASES
# once its last build is over SYNC_HOURS old, so a dropped run is caught up an
# hour later. A run with nothing to do takes seconds.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Upstream commit to build (leave empty to sync the bases)'
        default: ''
        required: false
      base:
        description: 'Upstream branch the commit belongs to'
        default: 'main'
        required: false

permissions:
  contents: write
  actions: write

env:
  BASES: "main 4.7"
  UPSTREAM_REPO: musescore/MuseScore
  BUILDS: "Build: Linux|Build: Windows|Build: macOS"
  KEEP_DAYS: 30
  SYNC_HOURS: 20
  MAX_PR_BUILDS: 4

jobs:
  lab:
    if: github.repository == 'davidstephengrant/MuseScore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push lab branches and start builds
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_TOKEN can't push commits that change .github/workflows,
          # so a token with Contents and Workflows write is used when set
          PUSH_TOKEN: ${{ secrets.LAB_PUSH_TOKEN || github.token }}
          FORK: ${{ github.repository }}
          IN_SHA: ${{ inputs.sha }}
          IN_BASE: ${{ inputs.base || 'main' }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Prints the commit a fork branch points at, or nothing
          fork_sha() {
            gh api "repos/$FORK/git/matching-refs/heads/$1" \
              --jq ".[] | select(.ref == \"refs/heads/$1\") | .object.sha"
          }

          set_branch() {
            local branch=$1 sha=$2
            if [ -n "$(fork_sha "$branch")" ]; then
              GH_TOKEN=$PUSH_TOKEN gh api -X PATCH "repos/$FORK/git/refs/heads/$branch" \
                -f sha="$sha" -F force=true --silent
            else
              GH_TOKEN=$PUSH_TOKEN gh api -X POST "repos/$FORK/git/refs" \
                -f ref="refs/heads/$branch" -f sha="$sha" --silent
            fi
            echo "$branch -> $sha"
          }

          start_builds() {
            local branch=$1 name
            IFS='|' read -ra names <<< "$BUILDS"
            for name in "${names[@]}"; do
              gh workflow run "$name" --repo "$FORK" --ref "$branch"
              echo "Started '$name' on $branch"
            done
          }

          if [ -n "$IN_SHA" ]; then
            sha=$(gh api "repos/$UPSTREAM_REPO/commits/$IN_SHA" --jq .sha)
            branch="lab-$IN_BASE-${sha:0:7}"
            if [ "$(fork_sha "$branch")" != "$sha" ]; then
              set_branch "$branch" "$sha"
            fi
            start_builds "$branch"
          else
            # Sync the bases about once a day; a run by hand always syncs
            sync_cutoff=$(date -u -d "$SYNC_HOURS hours ago" +%s)
            for base in $BASES; do
              last=$(gh api "repos/$FORK/actions/runs?branch=lab-$base&per_page=1" \
                --jq '.workflow_runs[0].created_at // empty')
              if [ "$EVENT_NAME" != workflow_dispatch ] && [ -n "$last" ] &&
                 [ "$(date -u -d "$last" +%s)" -ge "$sync_cutoff" ]; then
                echo "lab-$base was last built at $last; next sync after $SYNC_HOURS hours"
                continue
              fi
              sha=$(gh api "repos/$UPSTREAM_REPO/branches/$base" --jq .commit.sha)
              branch="lab-$base"
              if [ "$(fork_sha "$branch")" = "$sha" ]; then
                echo "$branch is already at $sha"
                continue
              fi
              set_branch "$branch" "$sha"
              start_builds "$branch"
            done

            # The base commit of each open PR assigned to or written by the owner.
            # A PR's CI build merges it into its base as the base was when the
            # build started: the base's newest commit before its first build run.
            started=0
            for n in $(for q in "assignee:$OWNER" "author:$OWNER"; do
                         gh api -X GET search/issues -f q="repo:$UPSTREAM_REPO is:pr is:open $q" \
                           -f per_page=100 --jq '.items[].number'
                       done | sort -un); do
              if [ "$started" -ge "$MAX_PR_BUILDS" ]; then
                echo "Started $MAX_PR_BUILDS PR base builds; the rest wait for the next run"
                break
              fi
              read -r head base < <(gh api "repos/$UPSTREAM_REPO/pulls/$n" --jq '"\(.head.sha) \(.base.ref)"')
              start=$(gh api "repos/$UPSTREAM_REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100" |
                jq -r --arg b "$BUILDS" '[.workflow_runs[] | select(.name as $n | $b | split("|") | index($n))
                                          | .created_at] | min // empty')
              if [ -z "$start" ]; then
                echo "#$n: no CI build yet"
                continue
              fi
              sha=$(gh api "repos/$UPSTREAM_REPO/commits?sha=$base&until=$start&per_page=1" --jq '.[0].sha // empty')
              [ -n "$sha" ] || continue
              # The build workflows with no run of that commit here yet (on lab-<base>
              # or lab-<base>-<sha7>; finished, running or failed all count)
              missing=$(gh api "repos/$FORK/actions/runs?head_sha=$sha&per_page=50" |
                jq -r --arg b "$BUILDS" '($b | split("|")) - [.workflow_runs[].name] | join("|")')
              if [ -z "$missing" ]; then
                echo "#$n: $base at ${sha:0:7} already built"
                continue
              fi
              branch="lab-$base-${sha:0:7}"
              echo "#$n: building $base at ${sha:0:7} ($missing)"
              if [ "$(fork_sha "$branch")" != "$sha" ]; then
                set_branch "$branch" "$sha"
              fi
              BUILDS=$missing start_builds "$branch"
              started=$((started + 1))
            done
          fi

          # Delete lab-<base>-<sha7> branches not built for KEEP_DAYS days
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%s)
          gh api "repos/$FORK/git/matching-refs/heads/lab-" --paginate \
            --jq '.[] | "\(.ref) \(.object.sha)"' |
          while read -r ref sha; do
            branch=${ref#refs/heads/}
            [[ $branch =~ ^lab-.+-[0-9a-f]{7}$ ]] || continue
            # Age from the last build on the branch, else from the commit
            when=$(gh api "repos/$FORK/actions/runs?branch=$branch&per_page=1" \
              --jq '.workflow_runs[0].created_at // empty')
            if [ -z "$when" ]; then
              when=$(gh api "repos/$FORK/commits/$sha" --jq .commit.committer.date)
            fi
            if [ "$(date -u -d "$when" +%s)" -lt "$cutoff" ]; then
              GH_TOKEN=$PUSH_TOKEN gh api -X DELETE "repos/$FORK/git/refs/heads/$branch" --silent
              echo "Deleted $branch (last activity $when)"
            fi
          done
